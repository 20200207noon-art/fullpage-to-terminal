<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="viewerTitle">Full-page screenshot</title>
    <style>
      :root {
        --bg: #14171c;
        --bar: #1c2128;
        --border: #2a313c;
        --text: #e6edf3;
        --muted: #8b949e;
        --ok: #2da44e;
        --info: #58a6ff;
        --err: #f85149;
        --err-bg: #2d1417;
        --err-bd: #6e2730;
        --err-fg: #ffb4ba;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      }
      body { display: flex; flex-direction: column; }

      /* ── Slim toolbar: brand · status · path · actions ───── */
      .bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        padding: 0 14px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
      }
      /* thin accent line signals state at a glance */
      .bar::after { content: none; }
      body.ok       .bar { box-shadow: inset 0 -2px 0 var(--ok); }
      body.fallback .bar { box-shadow: inset 0 -2px 0 var(--info); }
      body.err      .bar { box-shadow: inset 0 -2px 0 var(--err); }

      .brand {
        display: flex; align-items: center; gap: 8px;
        flex: 0 0 auto;
        font-weight: 700; font-size: 13px;
        letter-spacing: -0.2px;
        white-space: nowrap;
      }
      .brand img { width: 20px; height: 20px; display: block; }

      .status {
        display: flex; align-items: baseline; gap: 8px;
        min-width: 0;
        flex: 0 1 auto;
        white-space: nowrap;
      }
      .status .dot { font-size: 10px; }
      body.ok       .status .dot { color: var(--ok); }
      body.fallback .status .dot { color: var(--info); }
      body.err      .status .dot { color: var(--err); }
      #bannerTitle { font-size: 13px; font-weight: 700; }
      #bannerSub   { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
      #bannerSub b { color: var(--text); }
      #bannerSub kbd {
        display: inline-block;
        padding: 0 5px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px; font-weight: 600;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 4px;
        color: #fff;
      }
      #bannerSub .img-token {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px; font-weight: 700;
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 4px;
        padding: 0 5px;
      }

      /* saved path — truncated, click to copy */
      #bannerSaved {
        flex: 1 1 auto;
        min-width: 60px;
        margin: 0;
        text-align: right;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        direction: rtl;          /* keep the filename tail visible when truncated */
        cursor: pointer;
      }
      #bannerSaved:hover { color: var(--text); }
      #bannerSaved bdo { unicode-bidi: bidi-override; direction: ltr; }

      .actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .actions button {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        height: 30px;
        padding: 0 12px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      .actions button:hover { background: rgba(255,255,255,0.06); }
      /* fallback copy = the one primary action */
      #copyBtn {
        border: 0;
        background: var(--info); color: #0d1117;
        font-weight: 700;
      }
      #copyBtn:hover { filter: brightness(1.08); background: var(--info); }
      #copyBtn:disabled {
        background: var(--ok); color: #fff;
        cursor: default; filter: none;
      }
      #logsBtn { padding: 0 9px; color: var(--muted); }

      /* ── Image fills everything below the bar ───── */
      .img-wrap {
        flex: 1 1 auto;
        overflow: auto;
        background: var(--bg);
      }
      .img-wrap img {
        display: block;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
      }
      .img-wrap.actual-size img { max-width: none; width: auto; }

      /* ── Error / diagnostics panels ───── */
      .error {
        margin: 24px; padding: 16px;
        background: var(--err-bg);
        border: 1px solid var(--err-bd);
        border-radius: 8px; color: var(--err-fg);
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        overflow: auto;
      }
      #diagBox {
        flex: 0 0 auto;
        max-height: 40vh;
        overflow: auto;
        margin: 0;
        padding: 10px 14px;
        background: #0d1117;
        border-top: 1px solid var(--border);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <span class="brand">
        <img src="icons/icon48.png" alt="">
        <span data-i18n="extName">Fullpage to Terminal</span>
      </span>
      <span class="status">
        <span class="dot">●</span>
        <span id="bannerTitle"></span>
        <span id="bannerSub"></span>
      </span>
      <p id="bannerSaved" style="display:none;" title=""><bdo id="bannerSavedPath"></bdo></p>
      <span class="actions">
        <button id="copyBtn" type="button" style="display:none;">📋 Copy path</button>
        <button id="downloadBtn" type="button" data-i18n="btnSaveAs">⬇ Save as</button>
        <button id="logsBtn" type="button" title="Diagnostics">ⓘ</button>
      </span>
    </header>

    <div class="img-wrap actual-size" id="imgWrap" style="display:none;">
      <img id="shotImg" alt="screenshot">
    </div>

    <div id="errBox" class="error" style="display:none;"></div>
    <pre id="diagBox" style="display:none;"><code id="diagText"></code></pre>

    <script src="viewer.js"></script>
  </body>
</html>
